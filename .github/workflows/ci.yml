name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  
  format:
    name: Ruff Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check formatting
        run: ruff format --check .

  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Lint
        run: ruff check .

  test:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests
        env:
          APP_ENV: testing
          BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
        run: python -m pytest -v

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit --local

      - name: PROD-107 Security Failure Simulation
        run: |
          echo "Simulating Dependency Audit failure"
          exit 1


  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -t fastapi-production-lab:ci \
            .

      
      - name: Trivy Full Vulnerability Report
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: fastapi-production-lab:ci
          scan-type: image
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: false
          version: v0.76.2
          skip-files: '**/pip/_vendor/bom.cdx.json'

      - name: Trivy Fixable Vulnerability Gate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: fastapi-production-lab:ci
          scan-type: image
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          version: v0.76.2
          skip-files: '**/pip/_vendor/bom.cdx.json'



      - name: Generate vulnerability report
        if: ${{ always() }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/report" \
            aquasec/trivy:0.76.2 image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --skip-files '**/pip/_vendor/bom.cdx.json' \
            --format json \
            --output /report/trivy-report.json \
            fastapi-production-lab:ci

      - name: Summarize vulnerabilities
        if: ${{ always() }}
        run: |
          if [ ! -f trivy-report.json ]; then
            echo "Trivy report was not generated"
            exit 1
          fi

          python - <<'PY'
          import json
          from collections import Counter

          with open("trivy-report.json") as f:
              report = json.load(f)

          for result in report.get("Results", []):
              vulnerabilities = result.get("Vulnerabilities") or []

              if not vulnerabilities:
                  continue

              packages = Counter(
                  item["PkgName"] for item in vulnerabilities
              )

              fixable = sum(
                  bool(item.get("FixedVersion"))
                  for item in vulnerabilities
              )

              print("Target:", result.get("Target"))
              print("Total findings:", len(vulnerabilities))
              print("With fixed version:", fixable)
              print("Without fixed version:", len(vulnerabilities) - fixable)
              print("Top affected packages:")

              for name, count in packages.most_common(10):
                  print(f"  {name}: {count}")
          PY

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - format
      - lint
      - test
      - dependency-audit
      - secret-scan
      - image-scan

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="sha-${GITHUB_SHA}"

          docker build \
            -t "${IMAGE}:${TAG}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            .

          docker push "${IMAGE}:${TAG}"

          echo "Published image:"
          echo "${IMAGE}:${TAG}"

  deploy:
    name: Deploy Render Staging
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - publish

    permissions:
      contents: read

    environment: staging

    steps:
      
      - name: Deploy and verify Render staging
        shell: bash
        timeout-minutes: 25
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          BASE_URL: https://fastapi-production-lab.onrender.com
        run: |
          set -euo pipefail

          for name in RENDER_DEPLOY_HOOK_URL RENDER_API_KEY RENDER_SERVICE_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing $name"
              exit 1
            fi
          done

          echo "Deploying SHA: $GITHUB_SHA"

          HTTP_CODE=$(curl -sS \
            --retry 3 \
            --connect-timeout 10 \
            --max-time 45 \
            --get \
            --data-urlencode "ref=$GITHUB_SHA" \
            -o /tmp/deploy.json \
            -w '%{http_code}' \
            "$RENDER_DEPLOY_HOOK_URL")

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Deploy hook returned HTTP $HTTP_CODE"
            exit 1
          fi

          DEPLOY_ID=$(jq -r '.deploy.id // empty' /tmp/deploy.json)

          if [[ -z "$DEPLOY_ID" ]]; then
            echo "::error::Missing deploy ID"
            exit 1
          fi

          echo "Deployment ID: $DEPLOY_ID"

          DEPLOY_LIVE=false

          for attempt in {1..60}; do
            curl -fsS \
              --retry 3 \
              --connect-timeout 10 \
              --max-time 30 \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -o /tmp/deploy-status.json

            STATUS=$(jq -r '.status // empty' /tmp/deploy-status.json)
            echo "Attempt $attempt: $STATUS"

            case "$STATUS" in
              live)
                DEPLOY_LIVE=true
                break
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Deployment ended with $STATUS"
                exit 1
                ;;
              created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                sleep 15
                ;;
              *)
                echo "::error::Unexpected deployment status: $STATUS"
                exit 1
                ;;
            esac
          done

          if [[ "$DEPLOY_LIVE" != "true" ]]; then
            echo "::error::Deployment timed out"
            exit 1
          fi

          DEPLOYED_SHA=$(jq -r '.commit.id // empty' /tmp/deploy-status.json)

          if [[ "$DEPLOYED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Deploy SHA mismatch"
            echo "Expected: $GITHUB_SHA"
            echo "Actual: $DEPLOYED_SHA"
            exit 1
          fi

          echo "Deployment live with correct SHA."

          for endpoint in health ready; do
            CODE=$(curl -sS \
              --retry 5 \
              --retry-delay 5 \
              --max-time 30 \
              -o /tmp/"$endpoint".json \
              -w '%{http_code}' \
              "$BASE_URL/api/v1/$endpoint")

            if [[ "$CODE" != "200" ]]; then
              echo "::error::$endpoint returned HTTP $CODE"
              exit 1
            fi

            echo "$endpoint: HTTP 200"
          done

          echo "Post-deploy verification PASSED"
