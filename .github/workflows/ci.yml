name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  
  format:
    name: Ruff Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check formatting
        run: ruff format --check .

  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Lint
        run: ruff check .

  test:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests
        env:
          APP_ENV: testing
          BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
        run: python -m pytest -v

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit --local

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -t fastapi-production-lab:ci \
            .

      
      - name: Trivy Full Vulnerability Report
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: fastapi-production-lab:ci
          scan-type: image
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: false
          version: v0.76.2
          skip-files: '**/pip/_vendor/bom.cdx.json'

      - name: Trivy Fixable Vulnerability Gate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: fastapi-production-lab:ci
          scan-type: image
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          version: v0.76.2
          skip-files: '**/pip/_vendor/bom.cdx.json'



      - name: Generate vulnerability report
        if: ${{ always() }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/report" \
            aquasec/trivy:0.76.2 image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --skip-files '**/pip/_vendor/bom.cdx.json' \
            --format json \
            --output /report/trivy-report.json \
            fastapi-production-lab:ci

      - name: Summarize vulnerabilities
        if: ${{ always() }}
        run: |
          if [ ! -f trivy-report.json ]; then
            echo "Trivy report was not generated"
            exit 1
          fi

          python - <<'PY'
          import json
          from collections import Counter

          with open("trivy-report.json") as f:
              report = json.load(f)

          for result in report.get("Results", []):
              vulnerabilities = result.get("Vulnerabilities") or []

              if not vulnerabilities:
                  continue

              packages = Counter(
                  item["PkgName"] for item in vulnerabilities
              )

              fixable = sum(
                  bool(item.get("FixedVersion"))
                  for item in vulnerabilities
              )

              print("Target:", result.get("Target"))
              print("Total findings:", len(vulnerabilities))
              print("With fixed version:", fixable)
              print("Without fixed version:", len(vulnerabilities) - fixable)
              print("Top affected packages:")

              for name, count in packages.most_common(10):
                  print(f"  {name}: {count}")
          PY
